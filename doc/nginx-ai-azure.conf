# Bu içerik VPS'deki edge nginx config'ine eklenir:
#   /home/deploy/hetzner01/edge/nginx/conf.d/platform.conf
#
# 1) Mevcut 80'den 443'e redirect eden server block'taki `server_name` satırına
#    `ai-azure.agentechauth.com` ekleyin.
# 2) Aşağıdaki 443 server block'u dosyaya yeni bir block olarak ekleyin.
# 3) Edge'i restart edin:  cd /home/deploy/hetzner01/edge && docker compose restart nginx

server {
    listen 443 ssl;
    server_name ai-azure.agentechauth.com;

    ssl_certificate /etc/nginx/certs/agentechauth.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/agentechauth.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Webhook payload'ları küçük (~1KB), ama yine de yeterli sınır:
    client_max_body_size 1m;

    location / {
        proxy_pass http://floxo-listener:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
